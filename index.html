<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Analyse Loyers 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Indicateurs de loyers par commune (2025)</h1>
        <p>Source des données : <a href="https:
    </header>

    <main>
        <section id="search-bar">
            <input type="text" id="inputDpt" placeholder="Département (ex: 14)" maxlength="3">
            <input type="text" id="inputCommune" placeholder="Commune (ex: Caen)">
            <button onclick="window.location.reload()">Reset</button>
            <div class="limit-container">
                <label for="limit">Afficher :</label>
                <select id="selectLimit" onchange="filtrer()">
                    <option value="20">20</option>
                    <option value="50" selected>50</option>
                    <option value="100">100</option>
                    <option value="34875">Tout</option>
        </select>
    </div>
            
        </section>

        <section id="stats">
            <div class="stat-card">
                <h3>Résultats</h3>
                <span id="compteur">0</span>
                <p>villes trouvées</p></div>
            <div class="stat-card">Moyenne : <span id="moyenne">-</span> €/m²</div>
            <div class="stat-card">Min : <span id="min">-</span> €/m²</div>
            <div class="stat-card">Max : <span id="max">-</span> €/m²</div>
            <button onclick="trierParLoyer()">Trier par prix</button>
        </section>

        <section id="affichage-donnees">
            <table>
                <thead>
                    <tr>
                        <th>Code INSEE</th>
                        <th>Département</th>
                        <th>Commune</th>
                        <th>Loyer au m²</th>
                        <th>Loyer (T2 50 m²)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Projet réalisé par PAUL-HENRY, Sami et Clément</p>
    </footer>

    <script src="data.js"></script>
    <script src="load.js"></script>
</body>
</html>
